apiVersion: apps/v1
kind: Deployment
metadata:
  name: book
  namespace: online-library
spec:
  replicas: 1
  selector:
    matchLabels:
      app: book
  template:
    metadata:
      labels:
        app: book
    spec:
      containers:
        - name: book
          image: venkatanagababuallu/library:bookimage
          ports:
            - containerPort: 5002

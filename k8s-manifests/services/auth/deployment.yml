apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: online-library
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: venkatanagababuallu/library:authimage
          ports:
            - containerPort: 5001

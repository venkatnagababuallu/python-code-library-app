apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: online-library
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: venkatanagababuallu/pythonlibrary:appimage-v2
          ports:
            - containerPort: 5000
